name: Playwright Tests - Register

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'  # ทุกวันธรรมดา 16:00 Asia/Bangkok (UTC+7) — GitHub Actions ใช้ UTC เสมอ

jobs:
  test:
    name: Run Register Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Firefox)
        run: npx playwright install firefox --with-deps

      - name: Create users.json from secret
        run: echo '${{ secrets.USERS_JSON }}' > utils/users.json

      - name: Run register tests
        run: npm run test:register
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Generate test dashboard
        if: always()
        run: node scripts/generate-dashboard.js
        continue-on-error: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (JSON + screenshots + traces)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 14

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ github.run_number }}
          path: dashboard.html
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          if [ -f "test-results/results.json" ]; then
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const r = JSON.parse(fs.readFileSync('test-results/results.json','utf8'));
              const stats = r.stats || {};
              const passed = stats.expected || 0;
              const failed = stats.unexpected || 0;
              const skipped = stats.skipped || 0;
              const total = passed + failed + skipped;
              const icon = failed > 0 ? ':x:' : ':white_check_mark:';
              console.log(\`| \${icon} | Passed | Failed | Skipped | Total |\`);
              console.log('|---|---|---|---|---|');
              console.log(\`| | \${passed} | \${failed} | \${skipped} | \${total} |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi
