name: Playwright Tests - Register

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    name: Run Register Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Firefox)
        run: npx playwright install firefox --with-deps

      - name: Create users.json from secret
        run: echo '${{ secrets.USERS_JSON }}' > utils/users.json

      - name: Run register tests
        run: npm run test:register
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Generate test dashboard
        if: always()
        run: node scripts/generate-dashboard.js
        continue-on-error: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (JSON + screenshots + traces)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 14

      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ github.run_number }}
          path: dashboard.html
          retention-days: 14

      - name: Test summary
        if: always()
        run: node scripts/test-summary.js
